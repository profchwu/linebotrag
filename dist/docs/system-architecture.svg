<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1080" viewBox="0 0 1200 1080" role="img" aria-labelledby="title desc"><title id="title">LineBot + RAG 流程與架構</title><desc id="desc">三步驟建立 GAS 範本。GitHub Pages 提供前端，API 需要 Netlify 或本機後端。LINE 入口與完整 RAG 尚未完成。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#68877c"/></marker></defs><rect width="1200" height="1080" fill="#f4f7f5"/><g font-family="Arial,Microsoft JhengHei,sans-serif"><text x="40" y="54" font-size="34" fill="#29483e" font-weight="bold">LineBot + RAG</text><text x="40" y="87" font-size="20" fill="#29483e" font-weight="normal">從試算表規則到 GAS 範本｜流程、資料流與目前完成範圍</text><text x="930" y="52" font-size="18" fill="#29483e" font-weight="normal">作者 profchwu</text><text x="930" y="81" font-size="16" fill="#29483e" font-weight="normal">2026-09-24</text><text x="40" y="130" font-size="20" fill="#29483e" font-weight="bold">01  使用者操作流程</text><rect x="40" y="150" width="345" height="150" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="60" y="182" font-size="21" fill="#29483e" font-weight="bold">步驟 1｜準備試算表</text><text x="60" y="214" font-size="16" fill="#29483e" font-weight="normal">下載 Excel 範本並自行修改</text><text x="60" y="241" font-size="16" fill="#29483e" font-weight="normal">Data / Setting / Keywords</text><text x="60" y="268" font-size="16" fill="#29483e" font-weight="normal">上傳 Drive，另存 Google 試算表</text><rect x="425" y="150" width="350" height="150" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="445" y="182" font-size="21" fill="#29483e" font-weight="bold">步驟 2｜設定 Bot</text><text x="445" y="214" font-size="16" fill="#29483e" font-weight="normal">基本資訊、AI Prompt、API Key</text><text x="445" y="241" font-size="16" fill="#29483e" font-weight="normal">選擇模型並測試；編輯關鍵詞</text><text x="445" y="268" font-size="16" fill="#29483e" font-weight="normal">授權後讀寫 Keywords</text><rect x="815" y="150" width="345" height="150" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="835" y="182" font-size="21" fill="#29483e" font-weight="bold">步驟 3｜測試與下載</text><text x="835" y="214" font-size="16" fill="#29483e" font-weight="normal">測試文字／網址規則</text><text x="835" y="241" font-size="16" fill="#29483e" font-weight="normal">匯出 GAS 與設定 CSV</text><text x="835" y="268" font-size="16" fill="#29483e" font-weight="normal">雲端帳號與 LINE 部署需另完成</text><path d="M387 225 L420 225" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><path d="M777 225 L810 225" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="345" font-size="20" fill="#29483e" font-weight="bold">02  網頁工具架構</text><rect x="40" y="365" width="340" height="170" rx="16" fill="#e5efe9" stroke="#b4c8bf"/><text x="60" y="397" font-size="21" fill="#29483e" font-weight="bold">GitHub Pages｜靜態前端</text><text x="60" y="429" font-size="16" fill="#29483e" font-weight="normal">本機規則測試、GAS 產生、下載</text><text x="60" y="456" font-size="16" fill="#29483e" font-weight="normal">一般設定與文件存瀏覽器</text><text x="60" y="483" font-size="16" fill="#29483e" font-weight="normal">Key / OAuth Token 僅在記憶體</text><text x="60" y="510" font-size="16" fill="#29483e" font-weight="normal">不在 GitHub 執行後端</text><rect x="425" y="365" width="345" height="170" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="445" y="397" font-size="21" fill="#29483e" font-weight="bold">Netlify / 本機｜API 後端</text><text x="445" y="429" font-size="16" fill="#29483e" font-weight="normal">接收使用者自備的 Key / Token</text><text x="445" y="456" font-size="16" fill="#29483e" font-weight="normal">固定供應商介面、輸入驗證</text><text x="445" y="483" font-size="16" fill="#29483e" font-weight="normal">版本檢查、RAW 寫入及讀回驗證</text><text x="445" y="510" font-size="16" fill="#29483e" font-weight="normal">GitHub 版需自行設定此後端</text><rect x="815" y="365" width="345" height="170" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="835" y="397" font-size="21" fill="#29483e" font-weight="bold">外部服務</text><text x="835" y="429" font-size="16" fill="#29483e" font-weight="normal">OpenAI / Gemini / Grok</text><text x="835" y="456" font-size="16" fill="#29483e" font-weight="normal">模型清單與一次短文字測試</text><text x="835" y="483" font-size="16" fill="#29483e" font-weight="normal">Google Sheets：Keywords 同步</text><text x="835" y="510" font-size="16" fill="#29483e" font-weight="normal">第三方權限、配額與費用適用</text><path d="M382 450 L420 450" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><path d="M772 450 L810 450" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="578" font-size="20" fill="#29483e" font-weight="bold">03  匯出的 GAS 如何讀表</text><rect x="40" y="598" width="340" height="180" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="60" y="630" font-size="21" fill="#29483e" font-weight="bold">Google Sheets 範本</text><text x="60" y="662" font-size="16" fill="#29483e" font-weight="normal">Data：四個原始欄位，尚無自動紀錄</text><text x="60" y="689" font-size="16" fill="#29483e" font-weight="normal">Setting：模型、Prompt、開關</text><text x="60" y="716" font-size="16" fill="#29483e" font-weight="normal">Keywords：一列一條規則</text><text x="60" y="743" font-size="16" fill="#29483e" font-weight="normal">網頁尚未自動載入 Data / Setting</text><rect x="425" y="598" width="345" height="180" rx="16" fill="#ffffff" stroke="#b4c8bf"/><text x="445" y="630" font-size="21" fill="#29483e" font-weight="bold">GAS｜目前提供函式</text><text x="445" y="662" font-size="16" fill="#29483e" font-weight="normal">先讀 Keywords，第一筆命中回覆</text><text x="445" y="689" font-size="16" fill="#29483e" font-weight="normal">未命中：RAG → AI → 預設回覆</text><text x="445" y="716" font-size="16" fill="#29483e" font-weight="normal">AI / RAG 開關預設關閉</text><text x="445" y="743" font-size="16" fill="#29483e" font-weight="normal">實際優先順序依啟用開關決定</text><rect x="815" y="598" width="345" height="180" rx="16" fill="#fff4df" stroke="#b4c8bf" stroke-dasharray="7 5"/><text x="835" y="630" font-size="21" fill="#29483e" font-weight="bold">LINE 入口｜尚未完成</text><text x="835" y="662" font-size="16" fill="#29483e" font-weight="normal">Webhook 簽章驗證與事件去重</text><text x="835" y="689" font-size="16" fill="#29483e" font-weight="normal">使用者資料權限、正式訊息回覆</text><text x="835" y="716" font-size="16" fill="#29483e" font-weight="normal">需串接後才能成為運作中的 Bot</text><text x="835" y="743" font-size="16" fill="#29483e" font-weight="normal">API Key 放 GAS 指令碼屬性</text><path d="M382 685 L420 685" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><path d="M810 685 L775 685" stroke="#68877c" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="824" font-size="20" fill="#29483e" font-weight="bold">04  RAG 是選配；完整文件管線尚未完成</text><rect x="40" y="845" width="1120" height="115" rx="16" fill="#fff4df" stroke="#b4c8bf" stroke-dasharray="7 5"/><text x="60" y="877" font-size="21" fill="#29483e" font-weight="bold">規劃中的流程</text><text x="60" y="909" font-size="16" fill="#29483e" font-weight="normal">Drive 文件 → OCR / 文字擷取 → 分段 / 向量索引 → 檢索 → AI 回答</text><text x="60" y="936" font-size="16" fill="#29483e" font-weight="normal">現有網頁僅本機文字比對；GAS 只有外部 RAG 查詢接口。並未提供 OCR、自動同步或向量服務。</text><text x="40" y="1004" font-size="17" fill="#29483e" font-weight="normal">資料邊界：API Key 不寫入 Sheet、GitHub 或下載檔；外部後端必須由你信任並管理。</text><text x="40" y="1035" font-size="17" fill="#29483e" font-weight="normal">此圖說明已實作與未完成的功能；測試通過不代表完整 LINE Bot 或 RAG 已上線。</text></g></svg>